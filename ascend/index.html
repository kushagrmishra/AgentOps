<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCEND — Inner Growth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Inter, system-ui, sans-serif;
      color: #191b1e;
      background: #f4f3ef;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; text-decoration: none; }

    /* ---- Fixed backdrop (z0) ---- */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(120% 90% at 50% 40%, rgba(92, 107, 120, 0.09), transparent 52%),
        linear-gradient(to bottom, transparent 60%, rgba(25, 27, 30, 0.04) 100%),
        linear-gradient(180deg, #f4f3ef 0%, #eceae3 100%);
    }

    /* ---- Paper grain (z1) ---- */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.35;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(25, 27, 30, 0.05) 0.6px, transparent 0.7px);
      background-size: 4px 4px;
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
      mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
    }

    /* ---- Halftone art (z2) ---- */
    .art {
      position: fixed;
      left: 50%;
      top: 52%;
      z-index: 2;
      width: min(1180px, 96vw);
      height: auto;
      transform: translate(-50%, -50%);
      transform-origin: 50% 48%;
      mix-blend-mode: multiply;
      opacity: 0;
      pointer-events: none;
      will-change: transform;
      user-select: none;
      animation:
        softIn 1.6s ease forwards,
        kenburns 22s ease-in-out 1.6s infinite alternate;
    }

    @keyframes softIn {
      from { opacity: 0; }
      to { opacity: 0.92; }
    }

    @keyframes kenburns {
      from { transform: translate(-50%, -50%) scale(1); }
      to { transform: translate(-50%, -50%) scale(1.04); }
    }

    /* ---- Legibility bloom (z3) ---- */
    .art-glow {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 3;
      width: min(760px, 80vw);
      aspect-ratio: 1.5;
      transform: translate(-50%, -50%);
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        rgba(244, 243, 239, 0.92) 0%,
        rgba(244, 243, 239, 0.62) 34%,
        transparent 66%
      );
    }

    /* ---- Content shell (z10) ---- */
    .shell {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
    }

    /* ---- Nav ---- */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 30px 56px;
      flex-shrink: 0;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-family: Manrope, sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.05em;
      color: #191b1e;
    }

    .wordmark-mark {
      width: 17px;
      height: 17px;
      color: #5c6b78;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      font-family: Inter, sans-serif;
      font-weight: 500;
      font-size: 14.5px;
      color: rgba(25, 27, 30, 0.62);
      transition: color 0.25s ease;
    }

    .nav-links a:hover {
      color: #191b1e;
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: Manrope, sans-serif;
      font-weight: 600;
      font-size: 14.5px;
      color: #f4f3ef;
      background: #191b1e;
      border: none;
      border-radius: 999px;
      padding: 11px 22px;
      cursor: pointer;
      box-shadow: 0 10px 26px -12px rgba(25, 27, 30, 0.5);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .nav-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px -12px rgba(25, 27, 30, 0.6);
    }

    /* ---- Hero ---- */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 24px 30px;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #5c6b78;
      margin-bottom: 30px;
    }

    .kicker::before,
    .kicker::after {
      content: "";
      display: block;
      width: 28px;
      height: 1px;
      background: #5c6b78;
      opacity: 0.7;
    }

    .hero h1 {
      font-family: Manrope, sans-serif;
      font-size: clamp(46px, 6.4vw, 88px);
      line-height: 1.0;
      letter-spacing: -0.04em;
      color: #191b1e;
      margin-bottom: 30px;
      max-width: 16ch;
    }

    .hero h1 .line-1 {
      display: block;
      font-weight: 400;
      color: rgba(25, 27, 30, 0.82);
    }

    .hero h1 .line-2 {
      display: block;
      font-weight: 800;
      color: #191b1e;
    }

    .sub {
      font-family: Inter, sans-serif;
      font-weight: 400;
      font-size: clamp(16px, 1.35vw, 19px);
      line-height: 1.55;
      color: rgba(25, 27, 30, 0.62);
      max-width: 480px;
      margin-bottom: 40px;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: Manrope, sans-serif;
      font-weight: 600;
      font-size: 15.5px;
      color: #f4f3ef;
      background: #191b1e;
      border: none;
      border-radius: 999px;
      padding: 15px 28px;
      cursor: pointer;
      box-shadow: 0 14px 34px -12px rgba(25, 27, 30, 0.45);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .hero-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px -12px rgba(25, 27, 30, 0.55);
    }

    .hero-cta svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ---- Corner captions (z11) ---- */
    .caption {
      position: fixed;
      bottom: 30px;
      z-index: 11;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 400;
      font-size: 11.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(25, 27, 30, 0.42);
    }

    .caption-left { left: 56px; }

    .caption-right {
      right: 56px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .caption-right svg {
      width: 13px;
      height: 13px;
      opacity: 0.7;
    }

    /* ---- Entrance motion ---- */
    @keyframes blurFadeUp {
      from {
        opacity: 0;
        filter: blur(20px);
        transform: translateY(38px);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    .rise {
      opacity: 0;
      animation: blurFadeUp 1s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }

    /* ---- Reduced motion ---- */
    @media (prefers-reduced-motion: reduce) {
      .rise {
        opacity: 1;
        animation: none;
        filter: none;
        transform: none;
      }

      .art {
        opacity: 0.92;
        animation: none;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* ---- Responsive ---- */
    @media (max-width: 960px) {
      .nav { padding: 22px 24px; }
      .nav-links { display: none; }
      .caption { display: none; }
      .art { width: 150vw; }
      .hero h1 { max-width: 14ch; }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <img
    class="art"
    src="ascend.png"
    alt=""
    width="1180"
    height="658"
    decoding="async"
  />

  <div class="art-glow" aria-hidden="true"></div>

  <div class="shell">
    <nav class="nav" aria-label="Primary">
      <a href="#" class="wordmark rise" style="animation-delay: 0ms">
        <svg class="wordmark-mark" viewBox="0 0 17 17" fill="none" aria-hidden="true">
          <path d="M3.5 10.5L8.5 5.5L13.5 10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3.5 14L8.5 9L13.5 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        ASCEND
      </a>

      <ul class="nav-links">
        <li class="rise" style="animation-delay: 90ms"><a href="#">Home</a></li>
        <li class="rise" style="animation-delay: 140ms"><a href="#">Practice</a></li>
        <li class="rise" style="animation-delay: 190ms"><a href="#">Explore</a></li>
        <li class="rise" style="animation-delay: 240ms"><a href="#">Help</a></li>
      </ul>

      <button type="button" class="nav-cta rise" style="animation-delay: 320ms">Begin</button>
    </nav>

    <main class="hero">
      <p class="kicker rise" style="animation-delay: 480ms">INNER GROWTH</p>

      <h1 class="rise" style="animation-delay: 600ms">
        <span class="line-1">Reach toward something higher,</span>
        <span class="line-2">and grow into what's next.</span>
      </h1>

      <p class="sub rise" style="animation-delay: 760ms">
        A daily practice for a steadier mind — breathe, reflect, and return to center, one quiet moment at a time.
      </p>

      <button type="button" class="hero-cta rise" style="animation-delay: 880ms">
        Enter the space
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </main>
  </div>

  <p class="caption caption-left rise" style="animation-delay: 1040ms">Stillness starts within.</p>
  <p class="caption caption-right rise" style="animation-delay: 1040ms">
    Scroll to discover
    <svg viewBox="0 0 13 13" fill="none" aria-hidden="true">
      <path d="M6.5 2.5v8M3.5 7.5l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </p>
</body>
</html>

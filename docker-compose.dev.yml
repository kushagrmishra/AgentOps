# Dev override — use with:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Overrides ENVIRONMENT to development so the server boots without
# Supabase DATABASE_URL.  Loads Clerk / API keys from server/.env.
# Runs client + marketing via `npm run dev` outside Docker.
# SQLite database persists in ./data/dev-db/ across container restarts.

services:
  app:
    ports:
      - '8000:8000'
    volumes:
      - dev-db-data:/app/data
    env_file:
      - server/.env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: sqlite:////app/data/agentops.db
      JWT_SECRET: dev-only-insecure-secret-change-me
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      LLM_PROVIDER: openai
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-5-20250929}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174"
      CLIENT_ORIGIN: "http://localhost:5173"
      STATIC_DIR: /app/client/dist
      WORKSPACE_ROOT: /app/server/workspace

volumes:
  dev-db-data:
